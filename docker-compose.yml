version: '3.8'

services:
  web:
    build: .
    container_name: ceyfs-web
    ports:
      - "80:80"  # Expose HTTP
    volumes:
      - .:/var/www/html
    environment:
      - MYSQL_HOST=ceylon-fashion-db-zu6efo
      - MYSQL_USER=root
      - MYSQL_PASSWORD=12345
      - MYSQL_DATABASE=sahan
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: ceylon-fashion-db-zu6efo
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD=12345
      MYSQL_DATABASE=sahan
      MYSQL_USER=root
      MYSQL_PASSWORD=12345
    volumes:
      - db_data:/var/lib/mysql
      - ./sahan.sql:/docker-entrypoint-initdb.d/sahan.sql  # Auto-import SQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge

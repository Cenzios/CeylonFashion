version: '3.8'

services:
  web:
    build: .
    container_name: ceyfs-web
    ports:
      - "6070:80"
    volumes:
      - .:/var/www/html
    environment:
      - MYSQL_HOST=db  # ✅ Must match service name below
      - MYSQL_USER=myuser
      - MYSQL_PASSWORD=mypass
      - MYSQL_DATABASE=sahan
    depends_on:
      db:
        condition: service_healthy  # ✅ Wait for DB health check
    restart: always
    networks:
      - app-network

  db:
    image: mysql:8.0  # ✅ Changed from 5.7 to 8.0
    container_name: ceyfs-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sahan
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypass
    volumes:
      - db_data:/var/lib/mysql
      - ./sahan.sql:/docker-entrypoint-initdb.d/sahan.sql
    healthcheck:  # ✅ Added health check
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "myuser", "-pmypass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    # ⚠️ Removed external port 3307 - not needed for internal connection

volumes:
  db_data:

networks:
  app-network:
    driver: bridge